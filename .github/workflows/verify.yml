name: Verify
on:
  push:
    branches: [master, feat/static-explorer-r1]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check viewer/app.js
      - run: node --check viewer/project-map-view.js
      - run: node --check viewer/feature-map-view.js
      - run: node --check viewer/feature-scene-view.js
      - run: node --check viewer/feature-migration-view.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: node tests/helpers/report-line-endings.mjs reports/startup
      - run: python scripts/check-report-startup.py reports/startup
      - run: node tests/helpers/feature-scene.mjs reports/feature-scene
      - run: python scripts/check-feature-scene.py reports/feature-scene
      - uses: actions/upload-artifact@v4
        with:
          name: report-startup-${{ runner.os }}
          path: |
            reports/startup
            reports/feature-scene
          retention-days: 7
          if-no-files-found: error
      - name: Archive the exact tested source (no credentials or working files)
        if: runner.os == 'Linux'
        run: git archive --format=tar --output="$RUNNER_TEMP/repographia-source.tar" HEAD
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: checkpoint-source
          path: ${{ runner.temp }}/repographia-source.tar
          retention-days: 30
          if-no-files-found: error
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: yaelysia/Codex-Monitor
          ref: 490d822a9593d8d4b78a9188dd0daa0ae791eaf6
          path: sample
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 801c47d70e045ce4b6e70c410b70f4a03b440725
          path: baseline-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tool
      - run: npm run build
        working-directory: tool
      - name: Install sample type declarations without running lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
        working-directory: sample
      - run: node scripts/verify-sample.mjs ../sample ../reports/codex-monitor
        working-directory: tool
      - name: Install locked baseline analyzer (same sample and type dependencies)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: baseline-tool
      - run: npm run build
        working-directory: baseline-tool
      - run: node scripts/verify-sample.mjs ../sample ../reports/baseline
        working-directory: baseline-tool
      - run: node scripts/compare-resolution.mjs ../reports/baseline/graph.json ../reports/codex-monitor/graph.json ../reports/codex-monitor/resolution-comparison.json
        working-directory: tool
      - run: node scripts/verify-project-map.mjs ../reports/baseline/graph.json ../reports/codex-monitor/graph.json ../reports/codex-monitor/project-map.json
        working-directory: tool
      - run: node scripts/verify-feature-map.mjs ../reports/codex-monitor
        working-directory: tool
      - run: node scripts/verify-feature-migration.mjs ../reports/baseline ../reports/codex-monitor
        working-directory: tool
      - run: node scripts/verify-agent.mjs ../reports/codex-monitor
        working-directory: tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tool/scripts/check-viewer.py reports/codex-monitor/index.html --legacy-report reports/codex-monitor/legacy-test.html --output reports/codex-monitor/preview.png
      - run: python tool/scripts/check-project-map.py reports/codex-monitor/index.html --output reports/codex-monitor/preview.png
      - run: python tool/scripts/check-feature-map.py reports/codex-monitor
      - run: python tool/scripts/check-feature-migration.py reports/codex-monitor
      - run: python tool/scripts/check-agent-report.py reports/codex-monitor/agent-replay/submission
      - uses: actions/upload-artifact@v4
        with:
          name: codex-monitor-report
          path: reports/codex-monitor
