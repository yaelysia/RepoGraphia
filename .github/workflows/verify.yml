name: Verify
on:
  push:
    branches: [master, feat/static-explorer-r1]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check viewer/app.js
      - name: Archive the exact tested source (no credentials or working files)
        if: runner.os == 'Linux'
        run: git archive --format=tar --output="$RUNNER_TEMP/repographia-source.tar" HEAD
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: checkpoint-source
          path: ${{ runner.temp }}/repographia-source.tar
          retention-days: 30
          if-no-files-found: error
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/checkout@v4
        with:
          repository: yaelysia/Codex-Monitor
          ref: 490d822a9593d8d4b78a9188dd0daa0ae791eaf6
          path: sample
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tool
      - run: npm run build
        working-directory: tool
      - name: Install sample type declarations without running lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
        working-directory: sample
      - run: node scripts/verify-sample.mjs ../sample ../reports/codex-monitor
        working-directory: tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tool/scripts/check-viewer.py reports/codex-monitor/index.html --output reports/codex-monitor/preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: codex-monitor-report
          path: reports/codex-monitor
